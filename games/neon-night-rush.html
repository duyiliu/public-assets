  <script>
  (() => {
    const root=document.getElementById('nr-racer-2610');
    if(!root||root.dataset.ready==='1') return;
    root.dataset.ready='1';
    const c=root.querySelector('#nr-canvas'),ctx=c.getContext('2d');
    const ui={speed:root.querySelector('#nr-speed'),distance:root.querySelector('#nr-distance'),overtakes:root.querySelector('#nr-overtakes'),life:root.querySelector('#nr-life'),nitro:root.querySelector('#nr-nitro-fill'),nitroText:root.querySelector('#nr-nitro-text'),pause:root.querySelector('#nr-pause'),overlay:root.querySelector('#nr-overlay'),title:root.querySelector('#nr-overlay-title'),desc:root.querySelector('#nr-overlay-desc'),action:root.querySelector('#nr-action')};
    if(!ctx){ui.desc.textContent='当前浏览器不支持 Canvas 游戏画面';return;}
    let W=700,H=425,dpr=1,raf=0,last=0,drag=false;
    const keys={left:false,right:false,brake:false,boost:false};
    let s;
    const rnd=(a,b)=>a+Math.random()*(b-a);
    const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
    const colors=['#ffbd55','#ff629f','#a7a7ff','#6de0a6','#e3e7f4'];
    const laneValues=[-.70,0,.70];
    function reset(){s={phase:'ready',x:0,speed:156,distance:0,passed:0,health:3,nitro:100,score:0,combo:0,clock:0,inv:0,flash:0,shake:0,spawn:1.15,traffic:[{lane:-.70,z:.30,color:colors[0]},{lane:.70,z:.52,color:colors[2]}]};for(const k in keys)keys[k]=false;root.querySelectorAll('[data-drive]').forEach(b=>b.classList.remove('nr-pressed'));hud();render();}
    function geometry(p){const t=Math.pow(clamp(p,0,1.08),1.55);const horizon=H*.32;const y=horizon+(H-horizon)*t;const half=W*(.058+.405*t);const bend=Math.sin(s.distance*.00065+(1-p)*2.05)*W*.047+Math.sin(s.distance*.00023+(1-p)*3.6)*W*.014*(1-p);return{y,half,cx:W*.5+bend};}
    function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill();}
    function resize(){const r=c.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;dpr=Math.min(2,window.devicePixelRatio||1);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);render();}
    function skyline(){const horizon=H*.32;const sky=ctx.createLinearGradient(0,0,0,horizon+45);sky.addColorStop(0,'#070d27');sky.addColorStop(.58,'#272155');sky.addColorStop(1,'#9a4878');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
      const haze=ctx.createRadialGradient(W*.76,horizon*.56,3,W*.76,horizon*.56,W*.32);haze.addColorStop(0,'rgba(240,104,180,.35)');haze.addColorStop(1,'rgba(240,104,180,0)');ctx.fillStyle=haze;ctx.fillRect(0,0,W,horizon+80);
      for(let i=0;i<46;i++){const x=(Math.sin(i*93.37)*.5+.5)*W,y=(Math.sin(i*43.17)*.5+.5)*horizon*.85;ctx.fillStyle=i%4===0?'rgba(172,229,255,.8)':'rgba(245,236,255,.48)';ctx.fillRect(x,y,i%6===0?2:1,i%6===0?2:1);}
      ctx.beginPath();ctx.arc(W*.78,horizon*.42,Math.max(14,W*.038),0,Math.PI*2);ctx.fillStyle='#f5cee5';ctx.fill();
      polygon([[0,horizon],[W*.14,horizon-H*.12],[W*.29,horizon],[W*.46,horizon-H*.11],[W*.61,horizon],[W*.80,horizon-H*.18],[W,horizon-H*.025],[W,horizon+8],[0,horizon+8]],'#342c57');
      for(let i=0;i<36;i++){let bw=W*.023+(i%4)*W*.005,x=i*W/35-3,h=H*(.035+((i*7)%10)*.008);ctx.fillStyle=i%3?'#131932':'#181b3a';ctx.fillRect(x,horizon-h,bw,h+8);if(i%2===0){ctx.fillStyle='rgba(104,181,224,.33)';for(let j=1;j<4;j++){const wy=horizon-h+j*h/5;ctx.fillRect(x+bw*.25,wy,Math.max(1,bw*.12),2);ctx.fillRect(x+bw*.65,wy,Math.max(1,bw*.10),2);}}}
      ctx.fillStyle='#221a36';ctx.fillRect(0,horizon,W,H-horizon);
    }
    function road(){const n=50,phase=Math.floor(s.distance/12);for(let i=0;i<n;i++){const g1=geometry(i/n),g2=geometry((i+1)/n);const alt=(Math.floor(i/3)+phase)%2===0;
        polygon([[g1.cx-g1.half,g1.y],[g1.cx+g1.half,g1.y],[g2.cx+g2.half,g2.y],[g2.cx-g2.half,g2.y]],alt?'#20273d':'#242c43');
        const curb=alt?'#e889c0':'#e7eeff';
        polygon([[g1.cx-g1.half*1.09,g1.y],[g1.cx-g1.half,g1.y],[g2.cx-g2.half,g2.y],[g2.cx-g2.half*1.09,g2.y]],curb);
        polygon([[g1.cx+g1.half,g1.y],[g1.cx+g1.half*1.09,g1.y],[g2.cx+g2.half*1.09,g2.y],[g2.cx+g2.half,g2.y]],curb);
        if((Math.floor(i/3)+Math.floor(s.distance/22))%3!==0)for(const sign of [-1,1]){const w1=Math.max(.4,g1.half*.009),w2=Math.max(.6,g2.half*.009),x1=g1.cx+sign*g1.half/3,x2=g2.cx+sign*g2.half/3;polygon([[x1-w1,g1.y],[x1+w1,g1.y],[x2+w2,g2.y],[x2-w2,g2.y]],'rgba(193,219,242,.69)');}
      }
      for(let i=0;i<10;i++){const p=(i+(s.distance%125)/125)/10;if(p<.10||p>1)continue;const g=geometry(p),z=Math.pow(p,1.5),poleH=H*(.015+.15*z);for(const side of [-1,1]){const x=g.cx+side*g.half*1.26,y=g.y;ctx.strokeStyle='rgba(97,204,255,.65)';ctx.lineWidth=Math.max(1,W*.0027*z);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-poleH);ctx.lineTo(x-side*W*.013*z,y-poleH);ctx.stroke();ctx.fillStyle=i%2===0?'#fa70d1':'#8eefff';ctx.beginPath();ctx.arc(x-side*W*.013*z,y-poleH,Math.max(1.3,W*.006*z),0,Math.PI*2);ctx.fill();}}
      if(keys.boost&&s.phase==='playing'&&s.nitro>0){ctx.strokeStyle='rgba(124,220,255,.26)';for(let i=0;i<15;i++){const p=((i*67+s.clock*290)%100)/100,g=geometry(p),x=g.cx+Math.sin(i*21)*g.half*.85;ctx.lineWidth=1+2*p;ctx.beginPath();ctx.moveTo(x,g.y);ctx.lineTo(x,g.y+H*.08*p);ctx.stroke();}}
    }
    function car(x,y,w,color,player=false){const h=w*1.52;ctx.save();ctx.translate(x,y);if(player){const lean=(keys.right?1:0)-(keys.left?1:0);ctx.rotate(lean*.042);}
      ctx.fillStyle='rgba(0,0,0,.46)';ctx.beginPath();ctx.ellipse(0,-h*.22,w*.61,h*.45,0,0,Math.PI*2);ctx.fill();
      if(player){ctx.shadowColor='#15dcff';ctx.shadowBlur=w*.55;}ctx.fillStyle='#090c1b';ctx.fillRect(-w*.55,-h*.74,w*.20,h*.49);ctx.fillRect(w*.35,-h*.74,w*.20,h*.49);
      const body=ctx.createLinearGradient(-w*.5,0,w*.5,0);body.addColorStop(0,'#192538');body.addColorStop(.19,color);body.addColorStop(.54,color);body.addColorStop(.82,color);body.addColorStop(1,'#172038');
      polygon([[-w*.39,0],[-w*.50,-h*.21],[-w*.43,-h*.79],[-w*.27,-h*.96],[w*.27,-h*.96],[w*.43,-h*.79],[w*.50,-h*.21],[w*.39,0]],body);ctx.shadowBlur=0;
      polygon([[-w*.32,-h*.70],[w*.32,-h*.70],[w*.245,-h*.87],[-w*.245,-h*.87]],'#15334b');
      polygon([[-w*.33,-h*.58],[w*.33,-h*.58],[w*.39,-h*.41],[-w*.39,-h*.41]],'rgba(13,28,47,.78)');
      ctx.fillStyle='rgba(241,250,255,.36)';ctx.fillRect(-w*.29,-h*.76,w*.58,Math.max(1,w*.025));
      ctx.fillStyle=player?'#ff487a':'#ff5274';ctx.fillRect(-w*.41,-h*.22,w*.24,h*.065);ctx.fillRect(w*.17,-h*.22,w*.24,h*.065);
      ctx.fillStyle='#f1f3ff';ctx.fillRect(-w*.19,-h*.055,w*.38,Math.max(1,w*.025));
      if(player&&keys.boost&&s.nitro>0&&s.phase==='playing'){ctx.fillStyle='#64eaff';polygon([[-w*.22,0],[-w*.06,0],[-w*.14,h*(.24+Math.random()*.16)]],'#60e7ff');polygon([[w*.06,0],[w*.22,0],[w*.14,h*(.24+Math.random()*.16)]],'#60e7ff');}
      ctx.restore();}
    function traffic(){s.traffic.slice().sort((a,b)=>a.z-b.z).forEach(v=>{if(v.z<=0||v.z>1.13)return;const g=geometry(v.z),w=W*(.024+.082*Math.pow(v.z,1.5));car(g.cx+v.lane*g.half*.83,g.y,w,v.color);});}
    function player(){const g=geometry(.87),bottom=H*.935,w=clamp(W*.127,34,86);if(s.inv>0&&Math.floor(s.clock*15)%2===0)return;car(g.cx+s.x*geometry(1).half*.83,bottom,w,'#3ddbf2',true);}
    function render(){if(!s)return;ctx.clearRect(0,0,W,H);ctx.save();if(s.shake>0)ctx.translate((Math.random()-.5)*s.shake*9,(Math.random()-.5)*s.shake*6);skyline();road();traffic();player();ctx.restore();if(s.flash>0){ctx.fillStyle='rgba(255,74,121,'+(.14*s.flash)+')';ctx.fillRect(0,0,W,H);}}
    function hud(){ui.speed.textContent=Math.round(s.speed);ui.distance.textContent=Math.round(s.distance).toLocaleString('zh-CN');ui.overtakes.textContent=s.passed;ui.life.textContent='♥ '.repeat(s.health)+'♡ '.repeat(3-s.health);ui.nitro.style.width=Math.round(s.nitro)+'%';ui.nitroText.textContent=Math.round(s.nitro)+'%';ui.pause.disabled=s.phase==='ready'||s.phase==='over';ui.pause.textContent=s.phase==='paused'?'▶ 继续':'⏸ 暂停';}
    function screen(title,desc,action){ui.title.textContent=title;ui.desc.textContent=desc;ui.action.textContent=action;ui.overlay.hidden=false;}
    function begin(){if(s.phase==='ready'||s.phase==='over')reset();s.phase='playing';ui.overlay.hidden=true;hud();last=0;if(!raf)raf=requestAnimationFrame(frame);c.focus({preventScroll:true});}
    function stop(){if(raf){cancelAnimationFrame(raf);raf=0;}last=0;}
    function pause(){if(s.phase==='playing'){s.phase='paused';stop();screen('比赛暂停','调整节奏，再次出发！','▶ 继续比赛');}else if(s.phase==='paused'){begin();}hud();render();}
    function end(){s.phase='over';screen('比赛结束','完成 '+Math.round(s.distance).toLocaleString('zh-CN')+' 米 · 超车 '+s.passed+' 辆 · 得分 '+Math.round(s.score),'↻ 再来一局');hud();}
    function update(dt){s.clock+=dt;s.inv=Math.max(0,s.inv-dt);s.flash=Math.max(0,s.flash-dt*2.5);s.shake=Math.max(0,s.shake-dt*2.6);
      if(keys.left)s.x-=dt*1.58;if(keys.right)s.x+=dt*1.58;s.x=clamp(s.x,-.87,.87);
      const boosting=keys.boost&&s.nitro>0&&!keys.brake;const target=keys.brake?68:boosting?298:177;s.speed+=(target-s.speed)*Math.min(1,dt*(boosting?1.9:1.25));
      s.nitro=clamp(s.nitro+(boosting?-31:3.5)*dt,0,100);s.distance+=s.speed*dt/3.6;s.score+=s.speed*dt*.07;
      s.spawn-=dt;if(s.spawn<=0){s.traffic.push({lane:laneValues[Math.floor(Math.random()*3)],z:.03,color:colors[Math.floor(Math.random()*colors.length)]});s.spawn=rnd(.72,1.31)*(190/Math.max(125,s.speed));}
      for(const v of s.traffic){v.z+=s.speed*dt/845;if(!v.hit&&s.inv<=0&&v.z>.855&&v.z<1.01&&Math.abs(s.x-v.lane)<.32){v.hit=true;s.health--;s.speed*=.63;s.inv=1.25;s.flash=1;s.shake=1;s.combo=0;if(s.health<=0){end();break;}}if(v.z>1.075&&!v.hit){v.hit=true;s.passed++;s.combo++;s.score+=100+Math.min(10,s.combo)*20;s.nitro=clamp(s.nitro+5,0,100);}}
      s.traffic=s.traffic.filter(v=>v.z<1.14&&!v.hit);}
    function frame(t){raf=0;if(s.phase!=='playing')return;const dt=last?clamp((t-last)/1000,0,.045):.016;last=t;update(dt);render();hud();if(s.phase==='playing')raf=requestAnimationFrame(frame);}
    ui.action.addEventListener('click',begin);
    ui.pause.addEventListener('click',pause);
    const binding={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowDown:'brake',KeyS:'brake',ArrowUp:'boost',ShiftLeft:'boost',ShiftRight:'boost',KeyW:'boost'};
    root.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement||e.target instanceof HTMLTextAreaElement)return;if(binding[e.code]){e.preventDefault();keys[binding[e.code]]=true;}else if(e.code==='Space'&&!e.repeat){e.preventDefault();if(s.phase==='ready'||s.phase==='over')begin();else pause();}});
    root.addEventListener('keyup',e=>{if(binding[e.code]){e.preventDefault();keys[binding[e.code]]=false;}});
    root.addEventListener('focusout',e=>{if(!root.contains(e.relatedTarget))for(const k in keys)keys[k]=false;});
    root.querySelectorAll('[data-drive]').forEach(btn=>{const k=btn.dataset.drive;const off=()=>{keys[k]=false;btn.classList.remove('nr-pressed');};btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;btn.classList.add('nr-pressed');if(btn.setPointerCapture)btn.setPointerCapture(e.pointerId);});btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('lostpointercapture',off);});
    if('ResizeObserver'in window)new ResizeObserver(resize).observe(c);else window.addEventListener('resize',resize);
    reset();resize();screen('霓虹极速','穿梭夜色车流，超车得分，氮气冲刺！','▶ 开始比赛');
  })();
