<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Cyberpunk Chest · 3D Preview</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a11;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
    body{background:radial-gradient(circle at 50% 18%,#24304d 0,#101522 42%,#06080d 100%)}
    .shell{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px 8px;z-index:2;pointer-events:none}
    .title{font-size:15px;font-weight:750;letter-spacing:.03em}
    .hint{font-size:12px;opacity:.58}
    model-viewer{width:100%;height:100%;background:transparent;--poster-color:transparent}
    footer{padding:8px 16px 18px;text-align:center;font-size:12px;opacity:.58;pointer-events:none}
    .pill{display:inline-block;padding:6px 10px;border:1px solid rgba(255,255,255,.13);border-radius:999px;background:rgba(255,255,255,.05);backdrop-filter:blur(10px)}
    .error{position:fixed;inset:0;display:none;place-items:center;padding:28px;text-align:center;background:#090b10;z-index:10}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="title">CYBERPUNK CHEST · GLB</div>
      <div class="hint">拖动旋转 · 双指/滚轮缩放</div>
    </header>
    <model-viewer
      src="../assets/cyberpunk_chest_v2.glb"
      camera-controls
      auto-rotate
      rotation-per-second="18deg"
      shadow-intensity="1.25"
      shadow-softness=".8"
      exposure="1.15"
      environment-image="neutral"
      interaction-prompt="none"
      camera-orbit="35deg 70deg auto"
      min-camera-orbit="auto 15deg 55%"
      max-camera-orbit="auto 90deg 400%"
      alt="赛博朋克宝箱 3D 模型">
    </model-viewer>
    <footer><span class="pill">真实 GLB · 在线交互预览</span></footer>
  </div>
  <div class="error" id="error">模型加载失败，请刷新页面重试。</div>
  <script>
    const viewer=document.querySelector('model-viewer');
    viewer.addEventListener('error',()=>document.getElementById('error').style.display='grid');
  </script>
</body>
</html>
