name: Build GT Racecar GLB

on:
  push:
    paths:
      - 'models/gt_racecar_generator.py'
      - '.github/workflows/build-gt-racecar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install 3D dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "trimesh>=4,<5" pillow
      - name: Generate 3D geometry
        run: python models/gt_racecar_generator.py
      - name: Commit generated GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/gt_racecar_3d.glb
          if ! git diff --staged --quiet; then
            git commit -m "assets: build GT racing car GLB"
            git push
          fi
