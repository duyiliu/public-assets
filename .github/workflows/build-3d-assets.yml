name: Build 3D assets

on:
  push:
    branches: [main]
    paths:
      - "tools/generate_cyberpunk_chest.py"
      - ".github/workflows/build-3d-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy trimesh

      - name: Generate GLB
        run: python tools/generate_cyberpunk_chest.py

      - name: Commit generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cyberpunk_chest_v2.glb
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build cyberpunk chest GLB"
            git push
          fi
